<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="800" fill="#1F3D36"/>
  <circle cx="1020" cy="700" r="330" fill="#2A5047"/>
  <circle cx="90" cy="60" r="150" fill="#25473F"/>

  <!-- Handwritten recipe card (behind phone) -->
  <g transform="rotate(7 1050 440)">
    <rect x="940" y="290" width="220" height="290" rx="6" fill="#FFF8EC"/>
    <rect x="940" y="290" width="220" height="44" rx="6" fill="#F2C94C"/>
    <text x="958" y="320" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#1F3D36">Nonna's sauce</text>
    <g stroke="#1F3D36" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round">
      <line x1="960" y1="370" x2="1130" y2="370"/>
      <line x1="960" y1="402" x2="1100" y2="402"/>
      <line x1="960" y1="434" x2="1135" y2="434"/>
      <line x1="960" y1="466" x2="1090" y2="466"/>
      <line x1="960" y1="498" x2="1125" y2="498"/>
    </g>
    <circle cx="1128" cy="548" r="16" fill="#E4472B"/>
  </g>

  <!-- Story phone -->
  <g>
    <rect x="720" y="90" width="270" height="620" rx="38" fill="#FFF8EC"/>
    <rect x="738" y="108" width="234" height="584" rx="26" fill="#F2C94C"/>
    <!-- story progress bars -->
    <rect x="752" y="124" width="62" height="5" rx="2.5" fill="#1F3D36"/>
    <rect x="820" y="124" width="62" height="5" rx="2.5" fill="#1F3D36"/>
    <rect x="888" y="124" width="70" height="5" rx="2.5" fill="#1F3D36" fill-opacity="0.3"/>
    <!-- avatar + name -->
    <circle cx="772" cy="164" r="17" fill="#E4472B"/>
    <text x="772" y="170" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="17" fill="#FFF8EC">F</text>
    <text x="799" y="169" font-family="Trebuchet MS, Verdana, sans-serif" font-weight="bold" font-size="15" fill="#1F3D36">your.local.table</text>

    <!-- plate -->
    <circle cx="855" cy="400" r="104" fill="#FFF8EC"/>
    <circle cx="855" cy="400" r="84" fill="none" stroke="#1F3D36" stroke-opacity="0.15" stroke-width="3"/>
    <circle cx="855" cy="400" r="60" fill="#E4472B"/>
    <g fill="none" stroke="#F2C94C" stroke-width="7" stroke-linecap="round">
      <path d="M810 400 C 820 360, 890 360, 900 400"/>
      <path d="M805 415 C 825 450, 885 450, 905 415"/>
      <path d="M822 385 C 840 405, 870 405, 888 385"/>
    </g>
    <ellipse cx="840" cy="372" rx="15" ry="8" fill="#3E8E5A" transform="rotate(-30 840 372)"/>
    <ellipse cx="872" cy="428" rx="15" ry="8" fill="#3E8E5A" transform="rotate(25 872 428)"/>

    <!-- special sticker -->
    <g transform="rotate(-7 855 560)">
      <rect x="772" y="530" width="166" height="62" rx="31" fill="#E4472B"/>
      <text x="855" y="558" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="22" fill="#FFF8EC">Tuesday</text>
      <text x="855" y="581" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="22" fill="#FFF8EC">special</text>
    </g>
    <!-- reply bar -->
    <rect x="756" y="636" width="198" height="34" rx="17" fill="none" stroke="#1F3D36" stroke-width="2"/>
    <text x="774" y="658" font-family="Trebuchet MS, Verdana, sans-serif" font-size="14" fill="#1F3D36">Send message</text>
  </g>

  <!-- Title -->
  <g font-family="Georgia, serif" font-weight="bold" font-size="66" fill="#FFF8EC">
    <text x="70" y="270">Made by family,</text>
    <text x="70" y="346">shared with</text>
    <text x="70" y="422">the neighborhood.</text>
  </g>
  <text x="70" y="484" font-family="Trebuchet MS, Verdana, sans-serif" font-size="24" fill="#F2C94C">Social content for a family-owned restaurant group</text>

  <!-- Tags -->
  <g font-family="Trebuchet MS, Verdana, sans-serif" font-size="19" fill="#FFF8EC">
    <rect x="70" y="620" width="196" height="44" rx="22" fill="none" stroke="#F2C94C" stroke-width="2"/>
    <text x="168" y="648" text-anchor="middle">Behind the scenes</text>
    <rect x="280" y="620" width="172" height="44" rx="22" fill="none" stroke="#F2C94C" stroke-width="2"/>
    <text x="366" y="648" text-anchor="middle">Weekly specials</text>
    <rect x="466" y="620" width="166" height="44" rx="22" fill="none" stroke="#F2C94C" stroke-width="2"/>
    <text x="549" y="648" text-anchor="middle">Local bloggers</text>
  </g>
</svg>
